name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed to name nightlies after the latest release.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint release and run unit tests
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            # Nightlies carry the latest release's number so they sort above it, e.g. 0.5.1-nightly.15+45b7c4b.
            LATEST_TAG="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.0.0)"
            VERSION_NAME="${LATEST_TAG#v}-nightly.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Prepare signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 secret not set; release APK is signed with a throwaway debug key"
          fi

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/android-use-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/android-use-${VERSION_NAME}-debug.apk"

      - name: Verify release signature
        if: env.KEYSTORE_FILE != ''
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs dist/android-use-${VERSION_NAME}.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-use-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every push to main gets a brand-new pre-release with its own tag, so the release date is
          # the build date and Obtainium (with "Include prereleases" on) sees a new version each time.
          # The previous nightlies are removed, so only the latest one is kept.
          for old in $(gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease and (.tagName | startswith("nightly"))) | .tagName'); do
            gh release delete "$old" --yes --cleanup-tag || true
          done
          git push --delete origin nightly 2>/dev/null || true
          gh release create "nightly.${GITHUB_RUN_NUMBER}" "dist/android-use-${VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "Nightly ${VERSION_NAME}" \
            --notes "Latest build of main (${GITHUB_SHA}). Install the APK, start Shizuku, then grant access and sign in with ChatGPT in the app. The debug APK is in this run's workflow artifacts." \
            --prerelease

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Only the signed release APK, so Obtainium picks it without asking.
          files: dist/android-use-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
